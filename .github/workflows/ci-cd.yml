name: Test and deploy Training Data API

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: training_data
          POSTGRES_USER: training_data
          POSTGRES_PASSWORD: training_data_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training_data -d training_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://training_data:training_data_ci_password@localhost:5432/training_data
      TEST_DATABASE_URL: postgresql://training_data:training_data_ci_password@localhost:5432/training_data
      API_KEY: integration-api-key-with-more-than-20-chars
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Apply database migrations
        run: npm run migrate
      - name: Run unit tests
        run: npm test
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag training-data-api:${{ github.sha }} .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_API_TOKEN"
          test -n "$COOLIFY_RESOURCE_UUID"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_RESOURCE_UUID&force=false"
      - name: Wait for the public readiness route
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error https://train.uxi.asia/health/ready; then
              exit 0
            fi
            sleep 10
          done
          echo 'train.uxi.asia did not become ready within 10 minutes.'
          exit 1
      - name: Verify the deployed catalog
        run: |
          set -euo pipefail
          curl --fail --silent https://train.uxi.asia/rest/v1/grocery_catalog?is_active=eq.true > catalog.json
          node --input-type=commonjs -e "const rows=require('./catalog.json'); if(rows.length!==12) throw new Error('Expected 12 active catalog rows');"
